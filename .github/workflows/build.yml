name: Build Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build repository
        run: |
          rm -rf repo
          mkdir -p repo/debs

          find . -type f -name "*.deb" -not -path "./repo/*" -exec cp {} repo/debs/ \;

          if [ -f "CydiaIcon.png" ]; then
            cp "CydiaIcon.png" "repo/CydiaIcon.png"
          fi

          cd repo

          dpkg-scanpackages -m debs /dev/null > Packages

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Packages")
          text = path.read_text(encoding="utf-8")

          blocks = text.split("\n\n")
          new_blocks = []

          remove_fields = {
              "depiction",
              "sileodepiction",
              "nativedepiction",
              "icon",
              "homepage",
          }

          for block in blocks:
              if not block.strip():
                  continue

              lines = block.splitlines()
              result = []
              section_found = False

              for line in lines:
                  if ":" not in line:
                      result.append(line)
                      continue

                  field, value = line.split(":", 1)
                  field_lower = field.strip().lower()

                  if field_lower in remove_fields:
                      continue

                  if field_lower == "section":
                      result.append("Section: 插件")
                      section_found = True
                  else:
                      result.append(line)

              if not section_found:
                  result.append("Section: 插件")

              new_blocks.append("\n".join(result))

          path.write_text(
              "\n\n".join(new_blocks) + "\n\n",
              encoding="utf-8"
          )
          PY

          gzip -9 -c Packages > Packages.gz

          cat > Release <<'EOF'
          Origin: Qing Repo
          Label: Qing Repo
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64
          Components: main
          Description: Qing iOS Jailbreak Repository
          EOF

          touch .nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages