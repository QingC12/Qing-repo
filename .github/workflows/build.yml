name: Build Qing Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils zstd xz-utils gzip bzip2 lz4 lzma

      - name: Clean and rebuild DEB packages
        shell: bash
        run: |
          set -Eeuo pipefail

          export SOURCE_DATE_EPOCH=0

          rm -rf work repo
          mkdir -p work repo/debs

          while IFS= read -r -d '' deb; do

            name="$(basename "$deb")"
            pkgdir="work/${name%.deb}"
            output="repo/debs/$name"

            echo "========================================"
            echo "处理: $name"
            echo "========================================"

            rm -rf "$pkgdir"
            mkdir -p "$pkgdir"

            tmpdir="$(mktemp -d)"

            #
            # 拆解 DEB
            #
            ar x "$deb" --output "$tmpdir"

            echo "DEB 内部文件:"
            ls -lah "$tmpdir"

            #
            # 自动寻找 control archive
            #
            control_archive=""

            for f in \
              "$tmpdir"/control.tar.* \
              "$tmpdir"/control.tar; do

              if [ -f "$f" ]; then
                control_archive="$f"
                break
              fi

            done

            #
            # 自动寻找 data archive
            #
            data_archive=""

            for f in \
              "$tmpdir"/data.tar.* \
              "$tmpdir"/data.tar; do

              if [ -f "$f" ]; then
                data_archive="$f"
                break
              fi

            done

            #
            # 找不到 data archive
            #
            if [ -z "$data_archive" ]; then

              echo ""
              echo "========================================"
              echo "ERROR: 找不到 data.tar.*"
              echo "文件: $name"
              echo "========================================"
              echo ""
              echo "这个 DEB 的内部结构是:"
              ar t "$deb"
              echo ""

              rm -rf "$tmpdir"
              exit 1
            fi

            #
            # 找不到 control archive
            #
            if [ -z "$control_archive" ]; then

              echo ""
              echo "========================================"
              echo "ERROR: 找不到 control.tar.*"
              echo "文件: $name"
              echo "========================================"
              echo ""
              echo "这个 DEB 的内部结构是:"
              ar t "$deb"
              echo ""

              rm -rf "$tmpdir"
              exit 1
            fi

            echo "control archive: $(basename "$control_archive")"
            echo "data archive:    $(basename "$data_archive")"

            #
            # 解包 control
            #
            mkdir -p "$pkgdir/DEBIAN"

            case "$control_archive" in

              *.tar.zst)
                sudo tar \
                  --zstd \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.xz)
                sudo tar \
                  -xJ \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.gz|*.tgz)
                sudo tar \
                  -xz \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.bz2|*.tbz2)
                sudo tar \
                  -xj \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.lz4)
                lz4 -d "$control_archive" "$tmpdir/control.tar"
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$tmpdir/control.tar" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.lzma)
                lzma -dc "$control_archive" > "$tmpdir/control.tar"
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$tmpdir/control.tar" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar)
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *)
                echo "ERROR: 不支持的 control archive:"
                echo "$control_archive"
                rm -rf "$tmpdir"
                exit 1
                ;;

            esac

            #
            # 解包 data
            #
            case "$data_archive" in

              *.tar.zst)
                sudo tar \
                  --zstd \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar.xz)
                sudo tar \
                  -xJ \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar.gz|*.tgz)
                sudo tar \
                  -xz \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar.bz2|*.tbz2)
                sudo tar \
                  -xj \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar.lz4)
                lz4 -d "$data_archive" "$tmpdir/data.tar"
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$tmpdir/data.tar" \
                  -C "$pkgdir"
                ;;

              *.tar.lzma)
                lzma -dc "$data_archive" > "$tmpdir/data.tar"
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$tmpdir/data.tar" \
                  -C "$pkgdir"
                ;;

              *.tar)
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$data_archive" \
                  -C "$pkgdir"
                ;;

              *)
                echo "ERROR: 不支持的 data archive:"
                echo "$data_archive"
                rm -rf "$tmpdir"
                exit 1
                ;;

            esac

            #
            # 修复所有权
            #
            sudo chown -R "$(id -u):$(id -g)" "$pkgdir"

            control="$pkgdir/DEBIAN/control"

            if [ ! -f "$control" ]; then
              echo "ERROR: 找不到 DEBIAN/control"
              rm -rf "$tmpdir"
              exit 1
            fi

            #
            # 修复 control 权限
            #
            chmod 644 "$control"

            #
            # 确保 control 最后一行有换行
            #
            sed -i -e '$a\' "$control"

            #
            # 删除第三方跳转页面
            #
            sed -i '/^[Dd]epiction:/d' "$control"
            sed -i '/^[Ss]ileo[Dd]epiction:/d' "$control"
            sed -i '/^[Nn]ative[Dd]epiction:/d' "$control"
            sed -i '/^[Hh]omepage:/d' "$control"

            #
            # 统一 Section
            #
            if grep -qi '^Section:' "$control"; then
              sed -i 's/^Section:.*/Section: 插件/' "$control"
            else
              printf 'Section: 插件\n' >> "$control"
            fi

            #
            # 再次确保换行
            #
            sed -i -e '$a\' "$control"

            #
            # 修复 Debian 维护脚本权限
            #
            if [ -d "$pkgdir/DEBIAN" ]; then

              for script in \
                preinst \
                postinst \
                prerm \
                postrm \
                config; do

                if [ -f "$pkgdir/DEBIAN/$script" ]; then
                  chmod 755 "$pkgdir/DEBIAN/$script"
                fi

              done

            fi

            #
            # 重新打包
            #
            rm -f "$output"

            dpkg-deb \
              --build \
              --root-owner-group \
              "$pkgdir" \
              "$output"

            echo "完成: $output"

            rm -rf "$tmpdir"

          done < <(
            find . -type f -name '*.deb' \
              -not -path './repo/*' \
              -not -path './work/*' \
              -print0
          )

      - name: Build Packages index
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          dpkg-scanpackages -m debs /dev/null > Packages

          gzip -9 -n -f Packages

      - name: Create Release
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          cat > Release <<'EOF'
          Origin: Qing Repo
          Label: Qing Repo
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Qing iOS Jailbreak Repository
          EOF

      - name: Create .nojekyll
        run: |
          touch repo/.nojekyll

      - name: Copy CydiaIcon
        run: |
          if [ -f CydiaIcon.png ]; then
            cp CydiaIcon.png repo/CydiaIcon.png
          fi

      - name: Verify package sizes
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          gzip -dc Packages.gz > Packages

          python3 - <<'PY'
          import os
          import re

          with open("Packages", "r", encoding="utf-8", errors="replace") as f:
              data = f.read()

          entries = data.strip().split("\n\n")

          total = 0
          checked = 0
          failed = 0

          for entry in entries:

              filename = re.search(
                  r"^Filename:\s*(.+)$",
                  entry,
                  re.MULTILINE
              )

              size = re.search(
                  r"^Size:\s*(\d+)$",
                  entry,
                  re.MULTILINE
              )

              if not filename or not size:
                  continue

              total += 1

              path = filename.group(1).strip()
              expected = int(size.group(1))

              if not os.path.isfile(path):
                  print("ERROR: 文件不存在:", path)
                  failed += 1
                  continue

              actual = os.path.getsize(path)
              checked += 1

              if actual != expected:
                  print("ERROR:", path)
                  print("Expected:", expected)
                  print("Actual:  ", actual)
                  failed += 1

          print("========================================")
          print("Packages 条目:", total)
          print("实际检查:", checked)
          print("错误:", failed)
          print("========================================")

          if failed:
              raise SystemExit(1)

          print("所有软件包大小验证通过")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: false