name: Build Qing Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Clean and rebuild DEB packages
        shell: bash
        run: |
          set -Eeuo pipefail

          export SOURCE_DATE_EPOCH=0

          rm -rf work repo
          mkdir -p work repo/debs

          while IFS= read -r -d '' deb; do

            name="$(basename "$deb")"
            pkgdir="work/${name%.deb}"
            output="repo/debs/$name"

            echo "========================================"
            echo "处理: $name"
            echo "========================================"

            rm -rf "$pkgdir"
            mkdir -p "$pkgdir"

            tmpdir="$(mktemp -d)"

            cleanup_tmp() {
              rm -rf "$tmpdir"
            }

            trap cleanup_tmp EXIT

            #
            # 第一阶段：
            # 使用 ar 拆解 DEB
            #
            ar x "$deb" --output "$tmpdir"

            #
            # 找 control archive
            #
            control_archive=""

            if [ -f "$tmpdir/control.tar.zst" ]; then
              control_archive="$tmpdir/control.tar.zst"
            elif [ -f "$tmpdir/control.tar.xz" ]; then
              control_archive="$tmpdir/control.tar.xz"
            elif [ -f "$tmpdir/control.tar.gz" ]; then
              control_archive="$tmpdir/control.tar.gz"
            elif [ -f "$tmpdir/control.tar" ]; then
              control_archive="$tmpdir/control.tar"
            else
              echo "ERROR: 找不到 control.tar.*"
              exit 1
            fi

            #
            # 找 data archive
            #
            data_archive=""

            if [ -f "$tmpdir/data.tar.zst" ]; then
              data_archive="$tmpdir/data.tar.zst"
            elif [ -f "$tmpdir/data.tar.xz" ]; then
              data_archive="$tmpdir/data.tar.xz"
            elif [ -f "$tmpdir/data.tar.gz" ]; then
              data_archive="$tmpdir/data.tar.gz"
            elif [ -f "$tmpdir/data.tar" ]; then
              data_archive="$tmpdir/data.tar"
            else
              echo "ERROR: 找不到 data.tar.*"
              exit 1
            fi

            #
            # 第二阶段：
            # 解包 control.tar.*
            #
            mkdir -p "$pkgdir/DEBIAN"

            case "$control_archive" in

              *.tar.zst)
                sudo tar \
                  --zstd \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.xz)
                sudo tar \
                  -xJ \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar.gz)
                sudo tar \
                  -xz \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

              *.tar)
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$control_archive" \
                  -C "$pkgdir/DEBIAN"
                ;;

            esac

            #
            # 第三阶段：
            # 解包 data.tar.*
            #
            case "$data_archive" in

              *.tar.zst)
                sudo tar \
                  --zstd \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar.xz)
                sudo tar \
                  -xJ \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar.gz)
                sudo tar \
                  -xz \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$data_archive" \
                  -C "$pkgdir"
                ;;

              *.tar)
                sudo tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$data_archive" \
                  -C "$pkgdir"
                ;;

            esac

            #
            # 解包完成后，把所有权交还给 Actions 用户
            #
            sudo chown -R "$(id -u):$(id -g)" "$pkgdir"

            control="$pkgdir/DEBIAN/control"

            if [ ! -f "$control" ]; then
              echo "ERROR: 找不到 DEBIAN/control"
              exit 1
            fi

            #
            # 强制修复 control 权限
            #
            chmod 644 "$control"

            #
            # 确保 control 最后一行有换行
            #
            sed -i -e '$a\' "$control"

            #
            # 删除第三方源页面跳转信息
            #
            sed -i '/^[Dd]epiction:/d' "$control"
            sed -i '/^[Ss]ileo[Dd]epiction:/d' "$control"
            sed -i '/^[Nn]ative[Dd]epiction:/d' "$control"
            sed -i '/^[Hh]omepage:/d' "$control"

            #
            # 统一 Section
            #
            if grep -qi '^Section:' "$control"; then
              sed -i 's/^Section:.*/Section: 插件/' "$control"
            else
              printf 'Section: 插件\n' >> "$control"
            fi

            #
            # 再次确保最后有换行
            #
            sed -i -e '$a\' "$control"

            #
            # 修复 Debian 维护脚本权限
            #
            if [ -d "$pkgdir/DEBIAN" ]; then

              for script in \
                preinst \
                postinst \
                prerm \
                postrm \
                config; do

                if [ -f "$pkgdir/DEBIAN/$script" ]; then
                  chmod 755 "$pkgdir/DEBIAN/$script"
                fi

              done

            fi

            #
            # 删除旧输出
            #
            rm -f "$output"

            #
            # 重新打包
            #
            dpkg-deb \
              --build \
              --root-owner-group \
              "$pkgdir" \
              "$output"

            echo "完成: $output"

            #
            # 清理临时目录
            #
            rm -rf "$tmpdir"

            trap - EXIT

          done < <(
            find . -type f -name '*.deb' \
              -not -path './repo/*' \
              -not -path './work/*' \
              -print0
          )

      - name: Build Packages index
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          dpkg-scanpackages -m debs /dev/null > Packages

          gzip -9 -n -f Packages

      - name: Create Release
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          cat > Release <<'EOF'
          Origin: Qing Repo
          Label: Qing Repo
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Qing iOS Jailbreak Repository
          EOF

      - name: Create .nojekyll
        run: |
          touch repo/.nojekyll

      - name: Copy CydiaIcon
        run: |
          if [ -f CydiaIcon.png ]; then
            cp CydiaIcon.png repo/CydiaIcon.png
          fi

      - name: Verify package sizes
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          gzip -dc Packages.gz > Packages

          python3 - <<'PY'
          import os
          import re

          with open("Packages", "r", encoding="utf-8", errors="replace") as f:
              data = f.read()

          entries = data.strip().split("\n\n")

          total = 0
          checked = 0
          failed = 0

          for entry in entries:

              filename = re.search(
                  r"^Filename:\s*(.+)$",
                  entry,
                  re.MULTILINE
              )

              size = re.search(
                  r"^Size:\s*(\d+)$",
                  entry,
                  re.MULTILINE
              )

              if not filename or not size:
                  continue

              total += 1

              path = filename.group(1).strip()
              expected = int(size.group(1))

              if not os.path.isfile(path):
                  print("ERROR: 文件不存在:", path)
                  failed += 1
                  continue

              actual = os.path.getsize(path)
              checked += 1

              if actual != expected:
                  print("ERROR:", path)
                  print("Expected:", expected)
                  print("Actual:  ", actual)
                  failed += 1

          print("========================================")
          print("Packages 条目:", total)
          print("实际检查:", checked)
          print("错误:", failed)
          print("========================================")

          if failed:
              raise SystemExit(1)

          print("所有软件包大小验证通过")
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: false