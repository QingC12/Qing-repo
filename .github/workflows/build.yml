name: Build Jailbreak Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Prepare repo
        run: |
          mkdir -p repo/debs

          find . -maxdepth 2 -name "*.deb" -exec cp {} repo/debs/ \;

          echo "Found deb files:"
          ls -lh repo/debs

      - name: Generate Packages
        run: |
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -kf Packages

          echo "Generated files:"
          ls -lh

      - name: Generate Release
        run: |
          cd repo

          cat > Release <<'EOF'
          Origin: My Jailbreak Repo
          Label: My Jailbreak Repo
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64
          Components: main
          Description: My iOS Jailbreak Repository
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
