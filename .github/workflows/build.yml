name: Build Qing Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            binutils \
            zstd \
            xz-utils \
            gzip \
            bzip2 \
            lz4 \
            lzma


      - name: Rebuild DEB packages
        shell: bash
        run: |
          set -Eeuo pipefail

          export SOURCE_DATE_EPOCH=0

          rm -rf work
          rm -rf repo

          mkdir -p work
          mkdir -p repo/debs


          # ========================================
          # 通用 archive 解压函数
          # ========================================

          extract_archive() {

            archive="$1"
            destination="$2"

            case "$archive" in

              *.tar.zst)

                tar \
                  --zstd \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$archive" \
                  -C "$destination"

                ;;

              *.tar.xz)

                tar \
                  -xJ \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$archive" \
                  -C "$destination"

                ;;

              *.tar.gz|*.tgz)

                tar \
                  -xz \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$archive" \
                  -C "$destination"

                ;;

              *.tar.bz2|*.tbz2)

                tar \
                  -xj \
                  --no-same-owner \
                  --no-same-permissions \
                  -f "$archive" \
                  -C "$destination"

                ;;

              *.tar.lz4)

                temp_tar="$(mktemp)"

                lz4 \
                  -d \
                  "$archive" \
                  "$temp_tar"

                tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$temp_tar" \
                  -C "$destination"

                rm -f "$temp_tar"

                ;;

              *.tar.lzma)

                temp_tar="$(mktemp)"

                lzma \
                  -dc \
                  "$archive" \
                  > "$temp_tar"

                tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$temp_tar" \
                  -C "$destination"

                rm -f "$temp_tar"

                ;;

              *.tar)

                tar \
                  --no-same-owner \
                  --no-same-permissions \
                  -xf "$archive" \
                  -C "$destination"

                ;;

              *)

                echo ""
                echo "ERROR: 不支持的 archive:"
                echo "$archive"
                echo ""

                return 1

                ;;

            esac
          }


          # ========================================
          # 遍历 DEB
          # ========================================

          while IFS= read -r -d '' deb; do

            name="$(basename "$deb")"

            pkgdir="work/${name%.deb}"

            output="repo/debs/$name"

            tmpdir="$(mktemp -d)"


            echo ""
            echo "========================================"
            echo "处理: $name"
            echo "========================================"


            rm -rf "$pkgdir"

            mkdir -p "$pkgdir"


            # ========================================
            # 解包 DEB
            # ========================================

            ar x "$deb" --output "$tmpdir"


            echo ""
            echo "DEB 内部文件:"

            ls -lah "$tmpdir"


            # ========================================
            # 找 control archive
            # ========================================

            control_archive=""

            for f in \
              "$tmpdir"/control.tar.zst \
              "$tmpdir"/control.tar.xz \
              "$tmpdir"/control.tar.gz \
              "$tmpdir"/control.tar.bz2 \
              "$tmpdir"/control.tar.lz4 \
              "$tmpdir"/control.tar.lzma \
              "$tmpdir"/control.tar; do

              if [ -f "$f" ]; then

                control_archive="$f"

                break

              fi

            done


            # ========================================
            # 找 data archive
            # ========================================

            data_archive=""

            for f in \
              "$tmpdir"/data.tar.zst \
              "$tmpdir"/data.tar.xz \
              "$tmpdir"/data.tar.gz \
              "$tmpdir"/data.tar.bz2 \
              "$tmpdir"/data.tar.lz4 \
              "$tmpdir"/data.tar.lzma \
              "$tmpdir"/data.tar; do

              if [ -f "$f" ]; then

                data_archive="$f"

                break

              fi

            done


            if [ -z "$control_archive" ]; then

              echo ""
              echo "ERROR: 找不到 control.tar.*"
              echo "文件: $name"

              ar t "$deb"

              rm -rf "$tmpdir"

              exit 1

            fi


            if [ -z "$data_archive" ]; then

              echo ""
              echo "ERROR: 找不到 data.tar.*"
              echo "文件: $name"

              ar t "$deb"

              rm -rf "$tmpdir"

              exit 1

            fi


            echo ""
            echo "control archive: $(basename "$control_archive")"
            echo "data archive:    $(basename "$data_archive")"


            # ========================================
            # 单独解压 control
            # ========================================

            control_dir="$tmpdir/control"

            mkdir -p "$control_dir"

            extract_archive \
              "$control_archive" \
              "$control_dir"


            # ========================================
            # 创建 DEBIAN
            # ========================================

            mkdir -p "$pkgdir/DEBIAN"


            # ========================================
            # 找 control
            # ========================================

            control_source=""


            if [ -f "$control_dir/DEBIAN/control" ]; then

              control_source="$control_dir/DEBIAN/control"

            elif [ -f "$control_dir/control" ]; then

              control_source="$control_dir/control"

            else

              control_source="$(
                find "$control_dir" \
                  -type f \
                  -name control \
                  -print \
                  -quit \
                  2>/dev/null || true
              )"

            fi


            if [ -z "$control_source" ] || [ ! -f "$control_source" ]; then

              echo ""
              echo "ERROR: control.tar 中找不到 control"
              echo "文件: $name"

              find "$control_dir" \
                -maxdepth 6 \
                -print \
                2>/dev/null || true

              rm -rf "$tmpdir"

              exit 1

            fi


            cp \
              "$control_source" \
              "$pkgdir/DEBIAN/control"


            # ========================================
            # 解压 data
            # ========================================

            extract_archive \
              "$data_archive" \
              "$pkgdir"


            # ========================================
            # 修复权限
            # ========================================

            sudo chown \
              -R \
              "$(id -u):$(id -g)" \
              "$pkgdir" \
              || true

            chmod -R u+rwX "$pkgdir" || true


            control="$pkgdir/DEBIAN/control"


            # ========================================
            # 清理 Debian control
            # ========================================

            python3 - "$control" <<'PY'

          import sys


          path = sys.argv[1]


          with open(
              path,
              "r",
              encoding="utf-8",
              errors="replace"
          ) as f:

              lines = f.read().splitlines()


          output = []

          current_field = None


          for line in lines:

              # 空行
              if line.strip() == "":

                  # Description 中不能出现真正的空白行
                  if current_field == "Description":

                      output.append(" .")

                  continue


              # 新字段
              if not line.startswith((" ", "\t")) and ":" in line:

                  field = line.split(":", 1)[0].strip()

                  current_field = field

                  output.append(line)

                  continue


              # 续行
              if line.startswith((" ", "\t")):

                  output.append(line)

                  continue


              # 其他异常行
              output.append(line)


          with open(
              path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(output).rstrip("\n") + "\n"
              )

          PY


            # ========================================
            # 删除第三方源信息
            # ========================================

            sed -i '/^[Dd]epiction:/d' "$control"

            sed -i '/^[Ss]ileo[Dd]epiction:/d' "$control"

            sed -i '/^[Nn]ative[Dd]epiction:/d' "$control"

            sed -i '/^[Hh]omepage:/d' "$control"


            # ========================================
            # Section
            # ========================================

            if grep -qi '^Section:' "$control"; then

              sed -i \
                's/^Section:.*/Section: 插件/' \
                "$control"

            else

              printf 'Section: 插件\n' >> "$control"

            fi


            # ========================================
            # 确保 control 最后有换行
            # ========================================

            sed -i -e '$a\' "$control"


            # ========================================
            # 修复维护脚本
            # ========================================

            for script in \
              preinst \
              postinst \
              prerm \
              postrm \
              config; do

              if [ -f "$pkgdir/DEBIAN/$script" ]; then

                chmod 755 \
                  "$pkgdir/DEBIAN/$script"

              fi

            done


            # ========================================
            # 显示最终 control
            # ========================================

            echo ""
            echo "最终 control:"

            cat "$control"


            # ========================================
            # 重新打包
            # ========================================

            rm -f "$output"


            dpkg-deb \
              --build \
              --root-owner-group \
              "$pkgdir" \
              "$output"


            echo ""
            echo "完成:"
            echo "$output"


            rm -rf "$tmpdir"

          done < <(
            find . \
              -type f \
              -name '*.deb' \
              -not -path './repo/*' \
              -not -path './work/*' \
              -print0
          )


      # ========================================
      # 创建 Packages
      # ========================================

      - name: Build Packages index
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          dpkg-scanpackages \
            -m \
            debs \
            /dev/null \
            > Packages

          gzip \
            -9 \
            -n \
            -f \
            Packages


      # ========================================
      # 创建 Release
      # ========================================

      - name: Create Release
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          cat > Release <<'EOF'
          Origin: Qing Repo
          Label: Qing Repo
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Qing iOS Jailbreak Repository
          EOF


      # ========================================
      # .nojekyll
      # ========================================

      - name: Create .nojekyll
        run: |
          touch repo/.nojekyll


      # ========================================
      # CydiaIcon
      # ========================================

      - name: Copy CydiaIcon
        run: |
          if [ -f CydiaIcon.png ]; then
            cp CydiaIcon.png repo/CydiaIcon.png
          fi


      # ========================================
      # 验证 Packages
      # ========================================

      - name: Verify package sizes
        shell: bash
        run: |
          set -Eeuo pipefail

          cd repo

          gzip \
            -dc \
            Packages.gz \
            > Packages


          python3 - <<'PY'

          import os
          import re


          with open(
              "Packages",
              "r",
              encoding="utf-8",
              errors="replace"
          ) as f:

              data = f.read()


          entries = data.strip().split("\n\n")


          total = 0
          checked = 0
          failed = 0


          for entry in entries:

              filename = re.search(
                  r"^Filename:\s*(.+)$",
                  entry,
                  re.MULTILINE
              )

              size = re.search(
                  r"^Size:\s*(\d+)$",
                  entry,
                  re.MULTILINE
              )


              if not filename or not size:

                  continue


              total += 1


              path = filename.group(1).strip()

              expected = int(
                  size.group(1)
              )


              if not os.path.isfile(path):

                  print(
                      "ERROR: 文件不存在:",
                      path
                  )

                  failed += 1

                  continue


              actual = os.path.getsize(path)

              checked += 1


              if actual != expected:

                  print(
                      "ERROR:",
                      path
                  )

                  print(
                      "Expected:",
                      expected
                  )

                  print(
                      "Actual:",
                      actual
                  )

                  failed += 1


          print(
              "========================================"
          )

          print(
              "Packages 条目:",
              total
          )

          print(
              "实际检查:",
              checked
          )

          print(
              "错误:",
              failed
          )

          print(
              "========================================"
          )


          if failed:

              raise SystemExit(1)


          print(
              "所有软件包大小验证通过"
          )

          PY


      # ========================================
      # 部署 GitHub Pages
      # ========================================

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: false